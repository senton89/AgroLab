<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактирование документов</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-100">
<div class="flex h-screen">
  <!-- Sidebar -->
  <div class="w-64 bg-white shadow-md p-4 rounded-lg h-screen">
    <h1 class="text-xl font-semibold mb-4">Редактирование нормативного документа</h1>
    <ul class="space-y-2">
      <li><a href="CommonSettings.html" class="flex items-center p-2 text-gray-700 hover:bg-gray-200 rounded"><span class="mr-2">📁</span>Общее</a></li>
      <li><a href="DocumentContent.html" class="flex items-center p-2 text-gray-700 hover:bg-gray-200 rounded"><span class="mr-2">📁</span>Содержание</a></li>
      <li><a href="DocumentComponents.html" class="flex items-center p-2 text-gray-700 hover:bg-gray-200 rounded"><span class="mr-2">📁</span>Положения нормативного документа</a></li>
      <li><a href="DocumentEdit.html" class="flex items-center p-2 text-gray-700 hover:bg-gray-200 rounded"><span class="mr-2">📁</span>Структура</a></li>
    </ul>
  </div>
  <!-- Main Content -->
  <div class="flex-1 p-4">
    <div class="flex-1 flex">
      <!-- List Section -->
      <div class="bg-white w-1/2 p-6 rounded-lg shadow-md">
        <h3 class="text-lg font-semibold mb-4">Список разделов</h3>
        <div class="flex items-center mb-4">
          <input type="text" class="border p-2 flex-1 rounded" placeholder="Наименование">
          <button class="ml-2 p-2 bg-gray-300 rounded"><i class="fas fa-search"></i></button>
        </div>
        <div class="border p-2 rounded">
          <input type="checkbox" id="doc1" class="mr-2">
          <label for="doc1">Нормативный документ N201</label>
        </div>
      </div>
      <!-- Properties Section -->
      <div class="bg-white w-1/2 p-6 rounded-lg shadow-md ml-2">
        <h3 class="text-lg font-semibold mb-4">Свойства раздела</h3>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block mb-1 text-gray-700">Наименование *</label>
            <input type="text" class="border p-2 w-full rounded">
          </div>
          <div>
            <label class="block mb-1 text-gray-700">Расположение</label>
            <input type="text" class="border p-2 w-full rounded">
          </div>
          <div>
            <label class="block mb-1 text-gray-700">Официальное наименование *</label>
            <input type="text" class="border p-2 w-full rounded">
          </div>
          <div>
            <label class="block mb-1 text-gray-700">Обозначение *</label>
            <input type="text" class="border p-2 w-full rounded">
          </div>
          <div class="col-span-2">
            <label class="block mb-1 text-gray-700">Описание</label>
            <textarea class="border p-2 w-full rounded h-24"></textarea>
          </div>
        </div>
        <div class="flex justify-end mt-3">
          <button class="bg-white hover:bg-gray-200 text-gray-700 font-bold py-2 px-4 rounded mr-2">Отменить</button>
          <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Сохранить</button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
