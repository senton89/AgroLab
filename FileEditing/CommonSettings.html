<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактирование документов</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
<div class="flex">
  <!-- Sidebar -->
  <div class="w-64 bg-white shadow-md p-4 rounded-lg h-screen">
    <h1 class="text-xl font-semibold mb-4">Редактирование нормативного документа</h1>
    <ul class="space-y-2">
      <li><a href="CommonSettings.html" class="flex items-center p-2 text-gray-700 hover:bg-gray-200 rounded"><span class="mr-2">📁</span>Общее</a></li>
      <li><a href="DocumentContent.html" class="flex items-center p-2 text-gray-700 hover:bg-gray-200 rounded"><span class="mr-2">📁</span>Содержание</a></li>
      <li><a href="DocumentComponents.html" class="flex items-center p-2 text-gray-700 hover:bg-gray-200 rounded"><span class="mr-2">📁</span>Положения нормативного документа</a></li>
      <li><a href="DocumentEdit.html" class="flex items-center p-2 text-gray-700 hover:bg-gray-200 rounded"><span class="mr-2">📁</span>Структура</a></li>
    </ul>
  </div>
  <!-- Main Content -->
  <div class="flex-1 p-4">
    <div class="bg-white p-6 rounded-lg shadow-md h-full">
      <h2 class="text-lg font-bold mb-4">Общие настройки</h2>
      <form>
        <div class="grid grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block mb-1 text-gray-700">Наименование</label>
            <input type="text" value="Нормативный документ N201" class="w-full p-2 border border-gray-300 rounded" />
          </div>
          <div>
            <label class="block mb-1 text-gray-700">Обозначение</label>
            <input type="text" value="Demo" class="w-full p-2 border border-gray-300 rounded" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block mb-1 text-gray-700">Официальное наименование</label>
            <input type="text" class="w-full p-2 border border-gray-300 rounded" />
          </div>
          <div>
            <label class="block mb-1 text-gray-700">Тип нормативного документа</label>
            <input type="text" value="Методики испытаний" class="w-full p-2 border border-gray-300 rounded" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block mb-1 text-gray-700">Номер приказа о введении</label>
            <input type="text" class="w-full p-2 border border-gray-300 rounded" />
          </div>
          <div>
            <label class="block mb-1 text-gray-700">Описание</label>
            <textarea class="w-full p-2 border border-gray-300 rounded h-24">-</textarea>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-4 mb-4">
          <div>
            <label class="block mb-1 text-gray-700">Дата принятия</label>
            <input type="date" class="w-full p-2 border border-gray-300 rounded" />
          </div>
          <div>
            <label class="block mb-1 text-gray-700">Дата начала действия</label>
            <input type="date" class="w-full p-2 border border-gray-300 rounded" />
          </div >
          <div>
            <label class="block mb-1 text-gray-700">Дата окончания действия</label>
            <input type="date" class="w-full p-2 border border-gray-300 rounded" />
          </div>
        </div>
        <div class="flex justify-end">
          <button class="bg-white hover:bg-gray-200 text-gray-700 font-bold py-2 px-4 rounded">Отменить</button>
          <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Сохранить</button>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
