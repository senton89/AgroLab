<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компоненты документа</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body class="bg-gray-100">
<div class="flex">
  <!-- Sidebar -->
  <div class="w-64 bg-white shadow-md p-4 rounded-lg h-screen">
    <h1 class="text-xl font-semibold mb-4">Редактирование нормативного документа</h1>
    <ul class="space-y-2">
      <li><a href="CommonSettings.html" class="flex items-center p-2 text-gray-700 hover:bg-blue-100 rounded"><span class="mr-2">📁</span>Общее</a></li>
      <li><a href="DocumentContent.html" class="flex items-center p-2 text-gray-700 hover:bg-blue-100 rounded"><span class="mr-2">📁</span>Содержание</a></li>
      <li><a href="DocumentComponents.html" class="flex items-center p-2 text-gray-700 hover:bg-blue-100 rounded"><span class="mr-2">📁</span>Положения нормативного документа</a></li>
      <li><a href="DocumentEdit.html" class="flex items-center p-2 text-gray-700 hover:bg-blue-100 rounded"><span class="mr-2">📁</span>Структура</a></li>
      <li><a href="../FilesMetodicsMenu.html" class="flex items-center p-2 text-gray-700 hover:bg-blue-100 rounded"><span class="mr-2"><i class="fas fa-arrow-left"></i></span>В главное меню</a></li>
    </ul>
  </div>
  <!-- Main Content -->
  <div class="flex-1 p-4">
    <div class="bg-white p-6 rounded-lg shadow-md h-full">
      <h2 class="text-lg font-bold mb-4">Компоненты документа</h2>
      <form>
        <div class="mb-4">
          <input type="search" placeholder="Поисковый запрос" class="w-full p-2 border border-gray-300 rounded" />
        </div>
        <div class="overflow-x-auto">
          <table class="min-w-full text-gray-700">
            <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-blue-600 uppercase tracking-wider">Наименование</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-blue-600 uppercase tracking-wider">Краткое наименование</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-blue-600 uppercase tracking-wider">Тип</th>
            </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
            <!-- Table data -->
            </tbody>
          </table>
        </div>
        <div class="flex justify-end">
          <button class="bg-white hover:bg-blue-100 text-gray-700 font-bold py-2 px-4 rounded">Отменить</button>
          <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Сохранить</button>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
